name: Build public 200-case resource

on:
  push:
    branches: [main]
    paths:
      - 'resources/case-families/**'
      - 'resources/projections/source-grounded/**'
      - 'resources/cases/**'
      - 'docs/full-corpus/batch-*/M*-deep-case.md'
      - 'scripts/build-public-cases.mjs'
      - 'scripts/validate-public-cases.mjs'
      - '.github/workflows/build-public-cases.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build public case resource
        run: node scripts/build-public-cases.mjs --write
      - name: Check generated resource
        run: |
          node scripts/build-public-cases.mjs
          node scripts/validate-public-cases.mjs
          git diff --check
      - name: Commit generated resource when changed
        run: |
          if [ -z "$(git status --porcelain -- resources/cases/full-200-cases.v1.json)" ]; then
            echo 'Public case resource already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resources/cases/full-200-cases.v1.json
          git commit -m 'build: refresh plain 200-case resource'
          git push
