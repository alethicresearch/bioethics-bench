name: Export completion snapshot
on:
  push:
    branches:
      - author/full-corpus-completion-export-2
    paths:
      - .github/completion-export-trigger
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload completion snapshot
        uses: actions/upload-artifact@v4
        with:
          name: full-corpus-completion-snapshot
          path: |
            docs/full-corpus
            data/benchmark
            data/featured
            schemas
            scripts
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 1
