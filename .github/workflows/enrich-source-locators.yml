name: Enrich source locators

on:
  push:
    branches: [main]
    paths:
      - 'scripts/enrich-source-locators.mjs'
      - '.github/workflows/enrich-source-locators.yml'

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Enrich canonical locators
        run: node scripts/enrich-source-locators.mjs --write
      - name: Refresh Full Corpus manifest
        run: node scripts/build-full-corpus-manifest.mjs --write
      - name: Validate corpus except cross-repo pin
        run: |
          node scripts/build-featured-v1.mjs --check
          node scripts/check-dossier-sync.mjs
          node scripts/dossier-decision-sync.mjs
          node scripts/disposition-ledger.mjs
          node scripts/build-full-corpus-manifest.mjs
          node scripts/fidelity-audit.mjs
          node scripts/divergence-worksheet.mjs --check
          node scripts/bridge-worksheet.mjs
          node scripts/research-tasks.mjs
          node scripts/research-handoff.mjs
          node scripts/change-log.mjs
          node scripts/ingest-research-verdicts.mjs
          node scripts/verify-citations.mjs --offline
          node scripts/validate.mjs
      - name: Commit provenance-only enrichment
        run: |
          if git diff --quiet; then
            echo 'No locator changes required.'
            exit 0
          fi
          git config user.name 'xnuxi'
          git config user.email 'research@alethic.ai'
          git add data/benchmark releases/full-corpus-v1-completion-candidate/manifest.json docs/source-locators/UNRESOLVED_FULL_CORPUS.md
          git commit -m 'Enrich Full Corpus canonical source locators'
          git push
