name: Enrich source locators

on:
  push:
    branches: [main]
    paths:
      - 'scripts/enrich-source-locators.mjs'
      - 'scripts/apply-source-locator-overrides.mjs'
      - 'scripts/repair-source-placeholders.mjs'
      - 'docs/source-locators/source-locator-overrides*.json'
      - '.github/workflows/enrich-source-locators.yml'

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Replace verified research-packet placeholders with external sources
        run: node scripts/repair-source-placeholders.mjs --write
      - name: Enrich mechanically recoverable canonical locators
        run: node scripts/enrich-source-locators.mjs --write
      - name: Apply source-by-source verified locator overrides
        run: node scripts/apply-source-locator-overrides.mjs --write
      - name: Refresh unresolved locator report after overrides
        run: node scripts/enrich-source-locators.mjs --write
      - name: Refresh Full Corpus manifest
        run: node scripts/build-full-corpus-manifest.mjs --write
      - name: Validate corpus without regenerating review-coordination artifacts
        run: |
          node scripts/build-featured-v1.mjs --check
          node scripts/check-dossier-sync.mjs
          node scripts/dossier-decision-sync.mjs
          node scripts/disposition-ledger.mjs
          node scripts/build-full-corpus-manifest.mjs
          node scripts/fidelity-audit.mjs
          node scripts/divergence-worksheet.mjs --check
          node scripts/verify-citations.mjs --offline
          node scripts/validate.mjs
      - name: Commit provenance-only enrichment
        run: |
          if git diff --quiet -- data/benchmark releases/full-corpus-v1-completion-candidate/manifest.json docs/source-locators/UNRESOLVED_FULL_CORPUS.md; then
            echo 'No locator changes required.'
            exit 0
          fi
          git config user.name 'xnuxi'
          git config user.email 'research@alethic.ai'
          git add data/benchmark releases/full-corpus-v1-completion-candidate/manifest.json docs/source-locators/UNRESOLVED_FULL_CORPUS.md
          git commit -m 'Apply verified Full Corpus source locators'
          git push
