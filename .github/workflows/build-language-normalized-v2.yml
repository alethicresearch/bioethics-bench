name: Build Bioethics Bench v2 language-normalized releases

on:
  push:
    branches:
      - featured-v2-language-normalization-20260924
    paths:
      - 'scripts/build-featured-v2.mjs'
      - 'scripts/build-public-cases-v2.mjs'
      - 'scripts/language-normalization-v2.mjs'
      - 'resources/cases/full-200-cases.v1.json'
      - 'data/featured/**'
      - 'package.json'
      - '.github/workflows/build-language-normalized-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: featured-v2-language-normalization-20260924
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate v2 resources
        run: |
          node scripts/build-featured-v2.mjs --write
          node scripts/build-public-cases-v2.mjs --write
          git diff --check
      - name: Validate repository
        run: |
          npm run validate
          node scripts/validate-public-cases.mjs
      - name: Commit generated v2 resources
        run: |
          if [ -z "$(git status --porcelain -- resources/cases/featured-20.v2.json resources/cases/featured-20.v2.audit.json resources/cases/full-200-cases.v2.json resources/cases/full-200-cases.v2.audit.json)" ]; then
            echo "Generated v2 resources already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/cases/featured-20.v2.json resources/cases/featured-20.v2.audit.json resources/cases/full-200-cases.v2.json resources/cases/full-200-cases.v2.audit.json
          git commit -m "build: materialize language-normalized v2 releases"
          git push origin HEAD:featured-v2-language-normalization-20260924
