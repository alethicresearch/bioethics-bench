name: Build pre-study editorial corpus

on:
  push:
    branches:
      - prestudy-editorial-language-v2
    paths:
      - 'scripts/editorial-prose-normalize.mjs'
      - 'scripts/build-editorial-v1-1.mjs'
      - 'scripts/build-featured-v2.mjs'
      - 'resources/cases/full-200-cases.v1.json'
      - 'data/featured/*.json'
      - '.github/workflows/prestudy-editorial-language-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prestudy-editorial-language-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate editorial resources
        run: |
          node scripts/build-editorial-v1-1.mjs
          node scripts/build-featured-v2.mjs
          git diff --check
      - name: Validate repository
        run: |
          npm run validate
          node scripts/validate-public-cases.mjs
      - name: Commit generated resources
        run: |
          if [ -z "$(git status --porcelain -- resources/cases/full-200-cases.v1.1.json resources/cases/full-200-cases.v1.1.changes.json resources/cases/featured20-prestudy-v2.json resources/cases/featured20-prestudy-v2.changes.json)" ]; then
            echo "Generated resources already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/cases/full-200-cases.v1.1.json resources/cases/full-200-cases.v1.1.changes.json resources/cases/featured20-prestudy-v2.json resources/cases/featured20-prestudy-v2.changes.json
          git commit -m "build: generate pre-study language-cleaned corpus"
          git push origin HEAD:prestudy-editorial-language-v2
