name: Apply Full Corpus completion RC3

on:
  push:
    branches:
      - author/full-corpus-completion
    paths:
      - .completion/apply-full-corpus-completion-rc3

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: author/full-corpus-completion
          fetch-depth: 0
      - name: Verify checked completion payload
        shell: bash
        run: |
          set -euo pipefail
          echo '2284aac13658b8e26035583eef6a5fcb010cf674ca09be55509a746631397706  .completion/full-corpus-completion-rc3.tar.gz' | sha256sum -c -
      - name: Apply canonical records and control artifacts
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf .completion/full-corpus-completion-rc3.tar.gz -C .
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            git rm -f --ignore-unmatch "$path"
          done < .completion-transport/delete-paths.txt
          rm -rf .completion-transport
          git rm -rf --ignore-unmatch .completion
          git add data/benchmark docs/full-corpus/FULL_CORPUS_V1_COMPLETION_LEDGER.md releases/full-corpus-v1-completion-candidate/manifest.json
      - name: Commit canonical completion candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Apply canonical Full Corpus completion RC3 [skip ci]'
          git push origin HEAD:author/full-corpus-completion
