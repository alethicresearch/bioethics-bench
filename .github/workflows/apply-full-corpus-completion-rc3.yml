name: Apply Full Corpus completion RC3

on:
  push:
    branches:
      - author/full-corpus-completion
    paths:
      - .completion/apply-full-corpus-completion-rc3-repo

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: author/full-corpus-completion
          fetch-depth: 0
      - name: Reconstruct checked completion payload from repo transport
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .completion/rc3.part-00 \
            .completion/rc3.part-01 \
            .completion/rc3.part-02 \
            .completion/rc3.part-03 \
            .completion/rc3.part-04 \
            .completion/rc3.part-05 \
            .completion/rc3.part-06 \
            .completion/rc3.part-07 \
            .completion/rc3.part-08 \
            .completion/rc3.tail-09-16.b64 \
            | base64 -d > /tmp/full-corpus-rc3.tar.gz
          echo '2284aac13658b8e26035583eef6a5fcb010cf674ca09be55509a746631397706  /tmp/full-corpus-rc3.tar.gz' | sha256sum -c -
      - name: Apply canonical records and control artifacts
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/full-corpus-rc3.tar.gz -C .
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            git rm -f --ignore-unmatch "$path"
          done < .completion-transport/delete-paths.txt
          rm -rf .completion-transport
          git rm -rf --ignore-unmatch .completion
          git add data/benchmark docs/full-corpus/FULL_CORPUS_V1_COMPLETION_LEDGER.md releases/full-corpus-v1-completion-candidate/manifest.json
      - name: Commit canonical completion candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Apply canonical Full Corpus completion RC3 [skip ci]'
          git push origin HEAD:author/full-corpus-completion
