name: Validate records

# TEMPORARY: Full Corpus completion population mode.
# Push/PR validation is intentionally paused on author/full-corpus-completion
# to avoid one CI run/email per intermediate payload commit. Restore the
# ordinary push + pull_request triggers before this PR leaves draft status.
on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run validate
      - run: node scripts/validate-selftest.mjs
