name: Validate records

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      # Every committed record, against its schema, content hash, profile registry and dossier invariants.
      - run: npm run validate
      # Demonstrate each guard on a deliberately broken non-Featured record or profile entry.
      - run: node scripts/validate-selftest.mjs
