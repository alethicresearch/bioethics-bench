name: Validate records

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      # Every committed record, against its schema, content hash, profile registry and dossier invariants.
      - run: npm run validate
      # Demonstrate each guard on a deliberately broken non-Featured record or profile entry.
      - run: node scripts/validate-selftest.mjs
      # The two files the website and SACRE read. The build scripts fail when the committed file
      # no longer matches what the sources produce, so a hand-edited resource is caught here.
      - run: node scripts/build-public-cases.mjs
      - run: node scripts/build-case-sources.mjs
      - run: node scripts/validate-public-cases.mjs
